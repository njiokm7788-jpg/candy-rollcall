<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>CandyRollCall · 3D 点名</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <!-- 加载态：三颗跳动的粘土糖果 -->
  <div id="loading">
    <span class="clay-dot d1"></span>
    <span class="clay-dot d2"></span>
    <span class="clay-dot d3"></span>
    <span class="loading-text">正在加载…</span>
  </div>

  <!-- ============ 点名视图（默认，V2.1 交互精简：仅高频操作） ============ -->
  <div id="roll-view" class="hidden">
    <header class="roll-header">
      <span class="brand"><i class="brand-candy"></i>糖果点名</span>
      <div class="header-actions">
        <button id="btn-fullscreen" class="icon-btn" title="全屏">⛶</button>
        <button id="btn-more" class="icon-btn" title="更多">⋯</button>
        <button id="btn-collapse" class="icon-btn" title="收起到悬浮球">—</button>
      </div>
    </header>

    <!-- “更多”菜单：退出及次级操作（§4.3） -->
    <div id="more-menu" class="menu clay-card hidden">
      <button id="btn-manage" class="menu-item">📋 管理名单</button>
      <button id="btn-quit" class="menu-item danger">✕ 退出工具</button>
    </div>

    <main id="stage" class="stage three-d-stage">
      <!-- Three.js 3D 点名舞台：姓名牌、星河、聚光与定格动画 -->
      <div id="three-stage" class="three-stage"></div>
      <div class="stage-vignette"></div>
      <!-- 特效层：纸屑与庆祝粒子，随舞台裁剪 -->
      <div id="fx-layer" class="fx-layer"></div>

      <!-- EMPTY 状态 -->
      <div id="empty-state" class="state-panel hidden">
        <div class="clay-orb">📚</div>
        <p>还没有学生名单</p>
        <button id="btn-empty-manage" class="primary-btn">添加名单</button>
      </div>

      <!-- 首位在 3D 舞台定格，其余中选者依次进入结果条 -->
      <div id="result-overlay" class="result-overlay hidden">
        <div class="result-panel">
          <div class="result-head">
            <span class="result-kicker">✨ 本轮点名</span>
            <span id="result-count" class="result-count"></span>
          </div>
          <div id="result-cards" class="result-cards"></div>
        </div>
      </div>
    </main>

    <!-- ROUND_COMPLETE 提示条（置于 stage 之外，避免压住结果卡片） -->
    <div id="round-complete" class="round-banner hidden">
      <span class="banner-emoji">🎉</span>全班同学都被点到啦！
    </div>

    <footer class="roll-footer">
      <div class="scene-row">
        <span class="scene-label">3D 场景</span>
        <div id="scene-picker" class="scene-picker" title="切换 3D 点名场景"></div>
      </div>
      <div class="controls-row">
        <!-- 抽取人数 1~5（仅点名主页，§2） -->
        <div id="count-picker" class="count-picker" title="抽取人数"></div>
        <!-- 模式切换 -->
        <button id="btn-mode" class="mode-btn" title="切换模式">🔁 不重复</button>
        <!-- 剩余人数 -->
        <span id="remaining" class="remaining"></span>
      </div>
      <div class="action-row">
        <button id="btn-start" class="primary-btn big">开始点名</button>
        <button id="btn-reveal-now" class="reveal-btn hidden">⚡ 立即揭晓</button>
      </div>
    </footer>
  </div>

  <!-- ============ 管理视图（与点名视图同一窗口，前端切换） ============ -->
  <div id="manage-view" class="hidden">
    <header class="manage-header">
      <h2><i class="brand-candy"></i>名单管理</h2>
      <span id="manage-count" class="badge"></span>
      <div class="flex-spacer"></div>
      <button id="btn-close-manage" class="primary-btn">返回点名</button>
    </header>

    <nav class="manage-tabs clay-segment">
      <span id="seg-indicator" class="seg-indicator"></span>
      <button class="tab active" data-tab="list">名单编辑</button>
      <button class="tab" data-tab="tools">更多工具</button>
      <button class="tab" data-tab="settings">设置与维护</button>
    </nav>

    <!-- Tab 1: 名单编辑（高频：添加/编辑/删除/批量粘贴/导入，§8.1） -->
    <section id="tab-list" class="tab-panel">
      <div class="bento">
        <div class="bento-cell clay-card">
          <h3>添加学生</h3>
          <div class="field-row">
            <input id="inp-name" class="clay-input" placeholder="姓名（必填）" maxlength="50">
            <input id="inp-no" class="clay-input" placeholder="学号（可选）" maxlength="20">
          </div>
          <button id="btn-add" class="primary-btn">添加</button>
        </div>

        <div class="bento-cell clay-card">
          <h3>批量录入</h3>
          <div class="tool-group">
            <button id="btn-paste" class="ghost-btn">📋 批量粘贴</button>
            <button id="btn-import" class="ghost-btn">📂 导入 Excel/CSV</button>
          </div>
          <span id="dup-hint" class="hint"></span>
        </div>

        <!-- 批量粘贴面板 -->
        <div id="paste-panel" class="bento-cell wide clay-card hidden">
          <h3>批量粘贴</h3>
          <textarea id="paste-area" class="clay-input" rows="6" placeholder="每行一个姓名，或“学号 姓名”两列（制表符/逗号/空格分隔）&#10;示例：&#10;08  张小明&#10;张小明,09"></textarea>
          <div class="panel-actions">
            <button id="btn-paste-preview" class="primary-btn">预览</button>
            <button id="btn-paste-cancel" class="ghost-btn">取消</button>
          </div>
        </div>

        <!-- 导入预览面板 -->
        <div id="import-panel" class="bento-cell wide clay-card hidden">
          <h3>导入预览</h3>
          <div id="import-summary" class="import-summary"></div>
          <div id="import-issues" class="import-issues"></div>
          <div class="strategy-row">
            <label class="radio-chip"><input type="radio" name="strategy" value="replace"> 替换原名单</label>
            <label class="radio-chip"><input type="radio" name="strategy" value="append" checked> 追加到原名单</label>
          </div>
          <div class="panel-actions">
            <button id="btn-import-commit" class="primary-btn">确认导入</button>
            <button id="btn-import-cancel" class="ghost-btn">取消</button>
          </div>
        </div>

        <!-- 名单表 -->
        <div class="bento-cell wide clay-card">
          <h3>班级名单 <span class="hint">（✏️ 载入到上方编辑，🗑️ 删除）</span></h3>
          <div id="student-list" class="student-list"></div>
        </div>
      </div>
    </section>

    <!-- Tab 2: 更多工具（低频：导出，§8.1） -->
    <section id="tab-tools" class="tab-panel hidden">
      <div class="bento">
        <div class="bento-cell clay-card">
          <h3>导出 Excel</h3>
          <p class="hint">.xlsx · 序号 / 姓名 / 学号三列，学号按文本保存</p>
          <button id="btn-export-xlsx" class="ghost-btn">📤 导出名单 (.xlsx)</button>
        </div>
        <div class="bento-cell clay-card">
          <h3>导出 CSV</h3>
          <p class="hint">.csv · 带 BOM 的 UTF-8，Excel 直接打开不乱码</p>
          <button id="btn-export-csv" class="ghost-btn">📤 导出名单 (.csv)</button>
        </div>
      </div>
    </section>

    <!-- Tab 3: 设置与维护（高级，§8.1） -->
    <section id="tab-settings" class="tab-panel hidden">
      <div class="bento">
        <div class="bento-cell clay-card">
          <h3>基础动画时长</h3>
          <div class="setting-row">
            <input type="range" id="set-anim" min="2" max="8" step="1" value="4">
            <span id="set-anim-val" class="pill">4 秒</span>
          </div>
        </div>

        <div class="bento-cell clay-card">
          <h3>系统偏好</h3>
          <label class="switch-row">
            <input type="checkbox" id="set-snap">
            <span>悬浮球自动吸附左右边缘</span>
          </label>
          <label class="switch-row">
            <input type="checkbox" id="set-sww">
            <span>开机自动启动（仅当前用户）</span>
          </label>
        </div>

        <div class="bento-cell wide clay-card">
          <h3>维护</h3>
          <div class="tool-group">
            <button id="btn-reset-round" class="ghost-btn">🔄 重置本轮点名</button>
          </div>
          <p class="hint">抽取人数请在点名主页修改，此处不重复提供。</p>
        </div>
      </div>
    </section>
  </div>

  <!-- 通用确认对话框 -->
  <div id="confirm-mask" class="confirm-mask hidden">
    <div class="confirm-box clay-card">
      <p id="confirm-text"></p>
      <div class="panel-actions">
        <button id="confirm-ok" class="primary-btn">确认</button>
        <button id="confirm-cancel" class="ghost-btn">取消</button>
      </div>
    </div>
  </div>

  <script src="vendor/three-stage.bundle.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
